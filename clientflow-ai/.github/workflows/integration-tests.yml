name: Integration Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB:       clientflow_test
          POSTGRES_USER:     clientflow
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV:        test
      DATABASE_URL:    postgresql://clientflow:testpassword@localhost:5432/clientflow_test
      JWT_SECRET:      test-jwt-secret-for-ci-only
      FRONTEND_URL:    http://localhost:3000
      PORT:            5001
      TEST_EMAIL:      admin@example.com
      TEST_PASSWORD:   Test@12345

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: clientflow-ai/backend/package-lock.json

      - name: Install backend dependencies
        working-directory: clientflow-ai/backend
        run: npm ci

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U clientflow; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Run database schema
        env:
          PGPASSWORD: testpassword
        run: |
          psql -h localhost -U clientflow -d clientflow_test -f clientflow-ai/database/schema.sql

      - name: Seed test data
        env:
          PGPASSWORD: testpassword
        run: |
          psql -h localhost -U clientflow -d clientflow_test \
            -c "INSERT INTO users (name, email, password_hash, is_verified) VALUES ('Admin', 'admin@example.com', '\$2b\$10\$Yz6qPQ1rD7/4.kZv3E.oieMPNr6JJ.QJE3A5PNTS8GpWMrN5c.6Ee', true) ON CONFLICT DO NOTHING" || true

      - name: Run integration tests
        working-directory: clientflow-ai/backend
        run: npm test -- --testPathPattern="tests/integration" --forceExit --detectOpenHandles --runInBand
        timeout-minutes: 10

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: clientflow-ai/backend/test-results/
          retention-days: 7

      - name: Report test status
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              body:         '❌ Integration tests failed. Please check the [test logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).'
            })
